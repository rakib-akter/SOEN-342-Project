;stroke-width:0.5;"/><path d="M442,340.2949 L442,350.2949 L452,350.2949 L442,340.2949 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.2305" x="108.5234" y="357.8887">Staff refines the search;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.6602" x="108.5234" y="373.6182">if the patient is not registered, the use case ends</text><path d="M34,407.7539 L106.6631,407.7539 L106.6631,415.4834 L96.6631,425.4834 L34,425.4834 L34,407.7539 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="379.1025" style="stroke:#000000;stroke-width:1.5;" width="499.8491" x="34" y="407.7539"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="27.6631" x="49" y="421.3477">loop</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="109.6938" x="121.6631" y="420.4102">[no suitable slot yet]</text><polygon fill="#181818" points="393.0674,458.9424,403.0674,462.9424,393.0674,466.9424,397.0674,462.9424" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="122.2354" x2="399.0674" y1="462.9424" y2="462.9424"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.832" x="134.2354" y="442.0771">requestAvailableSlots(patientId, serviceId,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.9209" x="166.6909" y="457.8066">professionalId, locationId, date)</text><path d="M44,477.9424 L125.3213,477.9424 L125.3213,485.6719 L115.3213,495.6719 L44,495.6719 L44,477.9424 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="83.1885" style="stroke:#000000;stroke-width:1.5;" width="479.8491" x="44" y="477.9424"/><text 
:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="127.2354" x2="404.0674" y1="630.3193" y2="630.3193"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.5356" x="203.3835" y="609.4541">available time slots,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.1533" x="142.0747" y="625.1836">active referrals (if service requires one)</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="44" x2="462.707" y1="639.3193" y2="639.3193"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="225.4517" x="49" y="649.9756">[no slot on requested date (5c - FAILURE)]</text><polygon fill="#181818" points="133.2354,671.3584,123.2354,675.3584,133.2354,679.3584,129.2354,675.3584" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="127.2354" x2="404.0674" y1="675.3584" y2="675.3584"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.8979" x="210.7024" y="670.2227">no slots available</text><path d="M73,688.3584 L73,729.3584 L452,729.3584 L452,698.3584 L442,688.3584 L73,688.3584 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M442,688.3584 L442,698.3584 L452,698.3584 L442,688.3584 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.1182" x="113.2937" y="705.9521">Staff retries with another date or professional;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.1196" x="113.2937" y="721.6816">if no option suits the patient, the use case ends</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="44" x2="462.707" y1="735.817
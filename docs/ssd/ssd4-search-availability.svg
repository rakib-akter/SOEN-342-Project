<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="507px" preserveAspectRatio="none" style="width:507px;height:507px;background:#FFFFFF;" version="1.1" viewBox="0 0 507 507" width="507px" zoomAndPan="magnify"><title>SSD - Search Availability (success and failure scenarios)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="387.4473" x="58.9761" y="28.5625">SSD - Search Availability (success and failure scenarios)</text><rect fill="none" height="295.2236" style="stroke:#000000;stroke-width:1.5;" width="481.979" x="10" y="188.3379"/><rect fill="none" height="218.0352" style="stroke:#000000;stroke-width:1.5;" width="461.979" x="20" y="258.5264"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="98" x2="98" y1="119.8789" y2="500.5615"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="423.6997" x2="423.6997" y1="119.8789" y2="500.5615"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.4707" x="30" y="116.502">:AdministrativeStaff</text><ellipse cx="98.2354" cy="51.4395" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M98.2354,59.4395 L98.2354,86.4395 M85.2354,67.4395 L111.2354,67.4395 M98.2354,86.4395 L85.2354,101.4395 M98.2354,86.4395 L111.2354,101.4395 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="67.2793" x="390.6997" y="87.9395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.2793" x="397.6997" y="108.502">:System</text><path d="M22,134.8789 L22,175.8789 L500,175.8789 L500,144.8789 L490,134.8789 L22,134.8789 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M490,134.8789 L490,144.8789 L500,144.8789 L490,134.8789 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.7983" x="28" y="152.4727">Precondition: staff is identified and authenticated.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="457.3994" x="28" y="168.2021">Every search criterion is optional; the search returns AVAILABLE slots only</text><path d="M10,188.3379 L82.6631,188.3379 L82.6631,196.0674 L72.6631,206.0674 L10,206.0674 L10,188.3379 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="295.2236" style="stroke:#000000;stroke-width:1.5;" width="481.979" x="10" y="188.3379"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="27.6631" x="25" y="201.9316">loop</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="144.0527" x="97.6631" y="200.9941">[no suitable slot found yet]</text><polygon fill="#181818" points="412.3394,239.5264,422.3394,243.5264,412.3394,247.5264,416.3394,243.5264" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="98.2354" x2="418.3394" y1="243.5264" y2="243.5264"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.104" x="110.2354" y="222.6611">searchAvailability(professionalId, specialtyName,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.5059" x="172.5344" y="238.3906">locationId, fromDate, toDate)</text><path d="M20,258.5264 L80.8311,258.5264 L80.8311,266.2559 L70.8311,276.2559 L20,276.2559 L20,258.5264 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="218.0352" style="stroke:#000000;stroke-width:1.5;" width="461.979" x="20" y="258.5264"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="35" y="272.1201">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="174.9043" x="95.8311" y="271.1826">[one or more slots match (main)]</text><polygon fill="#181818" points="109.2354,309.7148,99.2354,313.7148,109.2354,317.7148,105.2354,313.7148" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="103.2354" x2="423.3394" y1="313.7148" y2="313.7148"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="86.7661" x="217.9043" y="292.8496">available slots</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.3442" x="140.6152" y="308.5791">(date, start, end, professional, location)</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="20" x2="481.979" y1="322.7148" y2="322.7148"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="325.6226" x="25" y="333.3711">[invalid criteria: unknown professional, specialty or location,</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="192.0811" x="25" y="346.6807">or fromDate after toDate (FAILURE)]</text><polygon fill="#181818" points="109.2354,368.0635,99.2354,372.0635,109.2354,376.0635,105.2354,372.0635" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="103.2354" x2="423.3394" y1="372.0635" y2="372.0635"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.3965" x="195.5891" y="366.9277">invalid search criteria</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="20" x2="481.979" y1="381.0635" y2="381.0635"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="201.1206" x="25" y="391.7197">[no available slot matches (FAILURE)]</text><polygon fill="#181818" points="109.2354,413.1025,99.2354,417.1025,109.2354,421.1025,105.2354,417.1025" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="103.2354" x2="423.3394" y1="417.1025" y2="417.1025"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.8979" x="208.3384" y="411.9668">no available slots</text><path d="M49,430.1025 L49,471.1025 L471,471.1025 L471,440.1025 L461,430.1025 L49,430.1025 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M461,430.1025 L461,440.1025 L471,440.1025 L461,430.1025 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.04" x="84.4695" y="447.6963">Staff widens the search (other date range, professional,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.8848" x="84.4695" y="463.4258">specialty or location), or the use case ends</text><!--SRC=[ZPBHRjim34NV_HL4dnp0sGTam00FpO02tL0is9xomiXqGbIcN8bEvxyVPSTTsgt00YInJFBgt2ifgoVOxMvX3Jl2w4vGdv4z7jYpZb2cmJbA2L0QQAqmH8BaI31oIAlYn0r16u8UmgyYFRBq6B63H4y3YQElDef7gZqV1MnAAHO5EWqHRZPrqx5mqeZAPzefjkqDO8AKdmeJKdRSewZrxiQarCtbCHM512K8PufpTvNVmWOU8haW3Ii7sSmbu0G6ASejKpFvm45F-OL3fUR3NhQcCnhpPDz5DagRpuEXpqheFu9DB1sHT8YIeFvPtztNd- -ta7nGQnO_5eKFeGS9a0PMF5YukMWH3RRnI5g0VMQmzQSBzQnxdNlPnz1QTjFcTutPwyanUXs_OKVLNdmmUAlcMXj3TsjMAj2G_rVJ7jPiH1PIX2v4kZ1sgEQWx91bRfjmZ6ATQIQi3U1CSc5FUocRITxgKIiWiKsl0IjOS6PDyec0vOoUcoLFtC0WZnAUvSteYxDCkkYOGrijnW1RaxYuW_ABnVxZ-_Pz_cNhroUAVzZiU5vxd7EXz1_YVyscbzPtBkLqi-4vNy9qVO_AO8i8ELk8A4Twa-fU_fdDgighh3EO5OVsOoSoKzX3aR-_0G00]--></g></svg>
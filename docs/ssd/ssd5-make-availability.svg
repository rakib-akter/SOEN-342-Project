"20" x2="541.3516" y1="383.4834" y2="383.4834"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="298.0259" x="25" y="394.1396">[invalid date range, time range or slot length (FAILURE)]</text><polygon fill="#181818" points="109.2354,415.5225,99.2354,419.5225,109.2354,423.5225,105.2354,419.5225" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="103.2354" x2="496.7119" y1="419.5225" y2="419.5225"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.4795" x="207.2339" y="414.3867">invalid availability parameters</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="20" x2="541.3516" y1="428.5225" y2="428.5225"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="300.0078" x="25" y="439.1787">[repeat pattern matches no date in the range (FAILURE)]</text><polygon fill="#181818" points="109.2354,460.5615,99.2354,464.5615,109.2354,468.5615,105.2354,464.5615" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="103.2354" x2="496.7119" y1="464.5615" y2="464.5615"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.5054" x="240.7209" y="459.4258">no slots generated</text><path d="M49,491.5615 L49,532.5615 L545,532.5615 L545,501.5615 L535,491.5615 L49,491.5615 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M535,491.5615 L535,501.5615 L545,501.5615 L535,491.5615 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.0713" x="100.6401" y="509.1553">Example: Dr. X, every Monday from 2026-11-01 to 2026-11-30,</text><text fill="#000000" font-family="sans-serif" font-size="13" leng
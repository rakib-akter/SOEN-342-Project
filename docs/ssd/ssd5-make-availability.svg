<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="555px" preserveAspectRatio="none" style="width:557px;height:555px;background:#FFFFFF;" version="1.1" viewBox="0 0 557 555" width="557px" zoomAndPan="magnify"><title>SSD - Make Availability (success and failure scenarios)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="376.79" x="91.7808" y="28.5625">SSD - Make Availability (success and failure scenarios)</text><rect fill="none" height="275.4941" style="stroke:#000000;stroke-width:1.5;" width="541.3516" x="10" y="204.0674"/><rect fill="none" height="198.3057" style="stroke:#000000;stroke-width:1.5;" width="521.3516" x="20" y="274.2559"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="98" x2="98" y1="119.8789" y2="548.0205"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="497.0723" x2="497.0723" y1="119.8789" y2="548.0205"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.4707" x="30" y="116.502">:AdministrativeStaff</text><ellipse cx="98.2354" cy="51.4395" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M98.2354,59.4395 L98.2354,86.4395 M85.2354,67.4395 L111.2354,67.4395 M98.2354,86.4395 L85.2354,101.4395 M98.2354,86.4395 L111.2354,101.4395 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="67.2793" x="464.0723" y="87.9395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.2793" x="471.0723" y="108.502">:System</text><path d="M49,134.8789 L49,191.8789 L545,191.8789 L545,144.8789 L535,134.8789 L49,134.8789 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M535,134.8789 L535,144.8789 L545,144.8789 L535,134.878
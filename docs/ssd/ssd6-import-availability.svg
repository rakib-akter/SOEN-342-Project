<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="518px" preserveAspectRatio="none" style="width:518px;height:518px;background:#FFFFFF;" version="1.1" viewBox="0 0 518 518" width="518px" zoomAndPan="magnify"><title>SSD - Import Availability from CSV (success and failure scenarios)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="453.3457" x="31.7537" y="28.5625">SSD - Import Availability from CSV (success and failure scenarios)</text><rect fill="none" height="276.1846" style="stroke:#000000;stroke-width:1.5;" width="478.5908" x="10" y="218.0674"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="88" x2="88" y1="119.8789" y2="511.252"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="430.3115" x2="430.3115" y1="119.8789" y2="511.252"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.4707" x="20" y="116.502">:AdministrativeStaff</text><ellipse cx="88.2354" cy="51.4395" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M88.2354,59.4395 L88.2354,86.4395 M75.2354,67.4395 L101.2354,67.4395 M88.2354,86.4395 L75.2354,101.4395 M88.2354,86.4395 L101.2354,101.4395 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#E2E2F0" height="30.9395" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="67.2793" x="397.3115" y="87.9395"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.2793" x="404.3115" y="108.502">:System</text><path d="M6,134.8789 L6,175.8789 L511,175.8789 L511,144.8789 L501,134.8789 L6,134.8789 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M501,134.8789 L501,144.8789 L511,144.8789 L501,134.8789 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="460.1924" x="12" y="152.4727">Precondition: staff is identified and authenticated; the clinic location exists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="484.853" x="12" y="168.2021">The CSV has no location column, so staff choose the location for the whole file</text><polygon fill="#181818" points="418.9512,199.0674,428.9512,203.0674,418.9512,207.0674,422.9512,203.0674" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="88.2354" x2="424.9512" y1="203.0674" y2="203.0674"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.687" x="145.2498" y="197.9316">importAvailability(filePath, locationId)</text><path d="M10,218.0674 L70.8311,218.0674 L70.8311,225.7969 L60.8311,235.7969 L10,235.7969 L10,218.0674 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="276.1846" style="stroke:#000000;stroke-width:1.5;" width="478.5908" x="10" y="218.0674"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.8311" x="25" y="231.6611">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="89.2944" x="85.8311" y="230.7236">[file read (main)]</text><polygon fill="#181818" points="99.2354,269.2559,89.2354,273.2559,99.2354,277.2559,95.2354,273.2559" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="93.2354" x2="429.9512" y1="273.2559" y2="273.2559"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.6182" x="160.2842" y="252.3906">import summary: slots imported,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="318.7158" x="100.2354" y="268.1201">professionals and specialties created, rows skipped</text><path d="M39,286.2559 L39,327.2559 L478,327.2559 L478,296.2559 L468,286.2559 L39,286.2559 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M468,286.2559 L468,296.2559 L478,296.2559 L468,286.2559 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.9961" x="90.2974" y="303.8496">Malformed rows and rows duplicating an existing slot</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.3779" x="90.2974" y="319.5791">are skipped and listed in the summary</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="488.5908" y1="333.7148" y2="333.7148"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="213.9414" x="15" y="344.3711">[file not found or unreadable (FAILURE)]</text><polygon fill="#181818" points="99.2354,365.7539,89.2354,369.7539,99.2354,373.7539,95.2354,369.7539" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="93.2354" x2="429.9512" y1="369.7539" y2="369.7539"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.8687" x="211.6589" y="364.6182">cannot read file</text><path d="M39,382.7539 L39,407.7539 L478,407.7539 L478,392.7539 L468,382.7539 L39,382.7539 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M468,382.7539 L468,392.7539 L478,392.7539 L468,382.7539 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.7725" x="145.9092" y="400.3477">Use case ends; nothing is imported</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="488.5908" y1="414.4834" y2="414.4834"/><